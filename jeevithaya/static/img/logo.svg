<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Jeevithaya Blood and Plasma Logo">
  <defs>
    <linearGradient id="jvBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef233c"/>
      <stop offset="55%" stop-color="#d90429"/>
      <stop offset="100%" stop-color="#9b031c"/>
    </linearGradient>
    <linearGradient id="jvDropGrad" x1="25%" y1="10%" x2="80%" y2="95%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffe4e8"/>
    </linearGradient>
  </defs>

  <!-- Crimson rounded badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#jvBgGrad)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.25" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>

  <!-- Blood / Plasma Droplet -->
  <path
    d="M 32 11 C 32 11, 47.5 27.5, 47.5 38.5 A 15.5 15.5 0 1 1 16.5 38.5 C 16.5 27.5, 32 11, 32 11 Z"
    fill="url(#jvDropGrad)"
  />

  <!-- Life / ECG Heartbeat Pulse -->
  <path
    d="M 20.5 39.5 L 25.5 39.5 L 28.5 31.5 L 33 46.5 L 36.5 35.5 L 39 39.5 L 43.5 39.5"
    fill="none"
    stroke="#d90429"
    stroke-width="2.9"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>

