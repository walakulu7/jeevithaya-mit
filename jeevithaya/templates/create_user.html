{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jeevithaya | Create User</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}?v=3.7" />
</head>
<body>

<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="side-brand">
      <div class="logo small">JV</div>
      <span>Jeevithaya</span>
    </div>

    <nav class="menu">
      <a class="menu-item" href="dashboard.html"
         data-role="System Admin,Hospital Admin,Front Office,Lab Assistant">Dashboard</a>

      <a class="menu-item" href="reports.html"
         data-role="System Admin,Hospital Admin">Reports</a>

      <a class="menu-item active" href="create_user.html"
         data-role="System Admin">Create User</a>
    </nav>

    <!-- Sidebar Theme Switcher -->
      <button id="sidebarThemeToggle" class="btn btn-ghost theme-toggle-btn" style="margin-top: auto; margin-bottom: 8px; justify-content: center; width: 100%;">
        <svg class="sun-icon" viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <span class="theme-label">Theme</span>
      </button>

      <button id="logoutBtn" class="btn btn-ghost logout" style="margin-top: 0;">Logout</button>
  </aside>

  <!-- Main -->
  <main class="main">
    <header class="topbar">
      <div>
        <h2>User Management</h2>
        <p class="muted">System Admin – User Accounts</p>
      </div>
      <button id="toggleFormBtn" class="btn btn-primary" type="button" data-action="toggle-form" data-target="userFormCard">
        + Add New User
      </button>
    </header>

    <!-- Form (Collapsible) -->
    <section class="card collapsible-form-card" id="userFormCard">
      <div class="form-header">
        <h3>Create New User</h3>
        <button type="button" class="btn-close-form" data-action="close-form">✕ Cancel</button>
      </div>
      <form id="userForm" class="grid-form">

        <div>
          <label class="label">Name</label>
          <input id="name" class="input" required>
        </div>

        <div>
          <label class="label">Email</label>
          <input id="email" type="email" class="input" required>
        </div>

        <div>
          <label class="label">Role</label>
          <select id="role" class="input" required>
            <option value="">-- Select Role --</option>
            <option>Hospital Admin</option>
            <option>Front Office</option>
            <option>Lab Assistant</option>
          </select>
        </div>

        <div>
          <label class="label">Password</label>
          <input id="password" type="password" class="input" required>
        </div>

        <div class="actions">
          <button class="btn btn-primary">Create User</button>
          <span id="msg" class="msg"></span>
        </div>

      </form>
    </section>

    <!-- Users Table -->
    <section class="card table-card">
      <h3>Users List</h3>

      <table id="userTable">
        <thead>
          <tr>
            <th>User ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

  </main>
</div>

<script src="{% static 'js/rbac.js' %}?v=3.7"></script>
<script src="{% static 'js/api.js' %}?v=3.7"></script>
<script src="{% static 'js/create_user.js' %}"></script>
</body>
</html>
