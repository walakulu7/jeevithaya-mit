<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>

  <link rel="stylesheet" href="{% static 'css/style.css' %}?v=3.8" />
</head>
<body>
  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="side-brand">
        <div class="logo small">JV</div>
        <span>Jeevithaya</span>
      </div>
<nav class="menu">

</nav>


      <!-- Sidebar Theme Switcher -->
      <button id="sidebarThemeToggle" class="btn btn-ghost theme-toggle-btn" style="margin-top: auto; margin-bottom: 8px; justify-content: center; width: 100%;">
        <svg class="sun-icon" viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <span class="theme-label">Theme</span>
      </button>

      <button id="logoutBtn" class="btn btn-ghost logout" style="margin-top: 0;">Logout</button>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <div>
          <h2>Donor Management</h2>
          <p class="muted">Search & view registered donors</p>
        </div>
        <button id="toggleFormBtn" class="btn btn-primary" type="button" data-action="toggle-form" data-target="donorFormCard">
          + Register New Donor
        </button>
      </header>

      <!-- Register Donor Form (Collapsible) -->
      <section class="card collapsible-form-card" id="donorFormCard">
        <div class="form-header">
          <h3>Register New Donor</h3>
          <button type="button" class="btn-close-form" data-action="close-form">✕ Cancel</button>
        </div>
        <form id="donorForm" class="grid-form">
          <div>
            <label class="label">Donor Name</label>
            <input class="input" id="donorName" type="text" placeholder="Full name" required />
          </div>
          <div>
            <label class="label">Blood Group</label>
            <select class="input" id="donorBloodGroup" required>
              <option value="">Select Group</option>
              <option>O+</option><option>O-</option>
              <option>A+</option><option>A-</option>
              <option>B+</option><option>B-</option>
              <option>AB+</option><option>AB-</option>
            </select>
          </div>
          <div>
            <label class="label">Contact Number</label>
            <input class="input" id="donorPhone" type="text" placeholder="e.g. 0771234567" required />
          </div>
          <div>
            <label class="label">Eligibility Status</label>
            <select class="input" id="donorStatus">
              <option value="Eligible">Eligible</option>
              <option value="Not Eligible">Not Eligible</option>
            </select>
          </div>
          <div>
            <label class="label">Email (Optional)</label>
            <input class="input" id="donorEmail" type="email" placeholder="donor@example.com" />
          </div>
          <div>
            <label class="label">Gender</label>
            <select class="input" id="donorGender">
              <option value="">Select Gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="span-2">
            <button class="btn btn-primary" type="submit">Register Donor</button>
          </div>
        </form>
        <div id="donorMsg" class="msg" role="alert" aria-live="polite"></div>
      </section>

      <!-- Filters -->
      <section class="card filters">
        <select id="bloodFilter" class="input">
          <option value="">All Blood Groups</option>
          <option>O+</option><option>O-</option>
          <option>A+</option><option>A-</option>
          <option>B+</option><option>B-</option>
          <option>AB+</option><option>AB-</option>
        </select>

        <select id="eligibilityFilter" class="input">
          <option value="">All Status</option>
          <option value="Eligible">Eligible</option>
          <option value="Not Eligible">Not Eligible</option>
        </select>

        <input id="searchInput" class="input" type="text" placeholder="Search by name or phone"/>
      </section>

      <!-- Donor Table -->
      <section class="card table-card">
        <table id="donorTable">
          <thead>
            <tr>
              <th>Donor ID</th>
              <th>Name</th>
              <th>Blood Group</th>
              <th>Contact</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            <!-- JS will fill -->
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <script src="{% static 'js/rbac.js' %}?v=3.8"></script>
  <script src="{% static 'js/api.js' %}?v=3.8"></script>
  <script src="{% static 'js/donors.js' %}"></script>
</body>
</html>
