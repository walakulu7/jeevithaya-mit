{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jeevithaya | Login</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'img/logo.svg' %}?v=5.6" />
  <link rel="stylesheet" href="{% static 'css/style.css' %}?v=5.6" />
</head>
<body>
  <div class="page">
    <div style="width: min(560px, 100%); display: flex; justify-content: flex-end; margin-bottom: 12px;">
      <button id="themeToggle" class="theme-toggle-btn" title="Toggle Theme" type="button">
        <svg class="sun-icon" viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <span class="theme-label">Theme</span>
      </button>
    </div>

    <div class="card auth-card">
      <div class="brand">
        <div class="logo"><img src="{% static 'img/logo.svg' %}?v=5.6" alt="Jeevithaya Logo" /></div>
        <div>
          <h1>Jeevithaya</h1>
          <p class="muted">Centralized Blood & Plasma Management</p>
        </div>
      </div>

      <h2 class="title">Login</h2>
      <p class="subtitle">Sign in to your account</p>

      <form id="loginForm" class="form">
        <label class="label" for="email">Email</label>
        <input id="email" class="input" type="email" placeholder="name@example.com" required autocomplete="username" />

        <label class="label" for="password">Password</label>
        <div class="input-row">
          <input id="password" class="input" type="password" placeholder="••••••••" required autocomplete="current-password" />
          <button type="button" id="togglePwd" class="btn btn-ghost" aria-label="Toggle password">
            Show
          </button>
        </div>

        <div class="row">
          <label class="check">
            <input id="remember" type="checkbox" />
            <span>Remember me</span>
          </label>
          <a class="link" href="#" id="forgotLink">Forgot password?</a>
        </div>

        <button class="btn btn-primary" type="submit">Sign In</button>

        <div id="msg" class="msg" role="alert" aria-live="polite"></div>

        <div class="demo-accounts" style="margin-top: 18px;">
          <p class="demo-title">⚡ Quick Demo Accounts (Click to auto-fill):</p>
          <div class="demo-chips">
            <button type="button" class="demo-chip" data-email="admin@jeevithaya.com" data-pwd="admin123">
              <span class="role-badge">System Admin</span>
              <span>admin@jeevithaya.com</span>
            </button>
            <button type="button" class="demo-chip" data-email="hospital@jeevithaya.com" data-pwd="hospital123">
              <span class="role-badge">Hospital Admin</span>
              <span>hospital@jeevithaya.com</span>
            </button>
            <button type="button" class="demo-chip" data-email="frontoffice@jeevithaya.com" data-pwd="front123">
              <span class="role-badge">Front Office</span>
              <span>frontoffice@jeevithaya.com</span>
            </button>
            <button type="button" class="demo-chip" data-email="lab@jeevithaya.com" data-pwd="lab123">
              <span class="role-badge">Lab Assistant</span>
              <span>lab@jeevithaya.com</span>
            </button>
          </div>
        </div>
      </form>
    </div>

    <footer class="footer">
      <span>© Jeevithaya | A System Designed & Developed By Group 5 MIT 2025 Batch </span>
    </footer>
  </div>

  <script src="{% static 'js/api.js' %}?v=5.6"></script>
  <script src="{% static 'js/login.js' %}?v=5.6"></script>
  <script src="{% static 'js/rbac.js' %}?v=5.6"></script>
</body>
</html>
